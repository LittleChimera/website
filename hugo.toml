baseURL = 'http://example.org/'
languageCode = 'en-us'
title = 'kuberik'
theme = 'hextra'

[params]
  rollout_controller_version = "v0.9.2"
  rollout_dashboard_version = "v0.9.1"
  openkruise_controller_version = "v0.4.0"
  latest_release = "v0.9.0"
  datadog_controller_version = "v0.1.0"
  environment_controller_version = "v0.1.5"

  [params.search]
    enable = true
    type = "flexsearch"

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "logo.svg"
      dark = "logo-dark.svg"

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.sidebar]
    autoCollapseState = false
    collapsible = false

  [params.blog]
    [params.blog.list]
      displayTags = true
      sortBy = "date"
      sortOrder = "desc"
      pagerSize = 10
    [params.blog.article]
      displayPagination = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github-dark'

[menu]
  [[menu.main]]
    identifier = "documentation"
    name = "Documentation"
    url = "/docs/"
    weight = 1

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 2

  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/kuberik/kuberik"
    weight = 4
    [menu.main.params]
      icon = "github"
